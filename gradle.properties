GROUP=dev.oxikt
ARTIFACT_ID=runtime
VERSION=0.0.0

POM_NAME=OxiKT Runtime
POM_DESCRIPTION=Runtime of OxiKT, Kotlin Multiplatform bindings for Rust libraries using UniFFI
POM_PACKAGING=jar
POM_INCEPTION_YEAR=2025

POM_URL=https://oxikt.dev/
POM_SCM_URL=https://github.com/UbiqueInnovation/oxikt
POM_SCM_CONNECTION=scm:git@github.com:UbiqueInnovation/oxikt.git
POM_SCM_DEV_CONNECTION=scm:git@github.com:UbiqueInnovation/oxikt.git

POM_LICENCE_NAME=MPL-2.0
POM_LICENCE_URL=https://github.com/UbiqueInnovation/oxikt/blob/main/LICENSE
POM_LICENCE_DIST=repo

POM_DEVELOPER_ID=UbiqueInnovation
POM_DEVELOPER_NAME=Ubique Innovation
POM_DEVELOPER_URL=https://www.ubique.ch/

SONATYPE_STAGING_PROFILE=dev.oxikt

# Gradle
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true

# Android
android.useAndroidX=true

# Enabled parallel sync
org.gradle.tooling.parallel=true
