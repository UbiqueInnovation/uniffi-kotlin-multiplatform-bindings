package_name = "mutable_records"
# `generate_immutable_records` defaults to false, so it has to be turned on here - without it
# every record is already mutable and there would be nothing for `mutable_records` to carve out.
generate_immutable_records = true
# Keyed by the record's name as Rust or the UDL declares it, whichever path defined it.
# A name matching no record is ignored rather than being an error.
mutable_records = ["UdlThawed", "ProcThawed", "NoSuchRecord"]
